<?xml version="1.0" encoding="UTF-8"?>
<!--
  Editable master for the Play Console's 1024x500 feature graphic.

  The scribble passes behind the wordmark, loops, and crosses back over itself
  heading right, ending in the yellow dot: the dot is the stroke's own end,
  coloured, so it reads as the fingertip that drew the line.

  Two paths, blue then green, meeting where the stroke crosses itself — the
  same handoff the icon makes, and for the same reason: the crossing is the one
  place a colour change reads as one stroke laid over another rather than as a
  seam. Green is drawn second so it covers the blue beneath it. Draw order and
  that overlap are load-bearing.

  Field colours are the icon's, not the brand light blue: the two assets sit
  together in the listing and should look like one app. See docs/brand.md.

  Export (Play rejects transparency here, unlike the 32-bit store icon):
    rsvg-convert -w 1024 -h 500 feature-graphic.svg -o feature-graphic.png
    magick feature-graphic.png -alpha remove -alpha off feature-graphic.png
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="500" viewBox="0 0 1024 500">

  <style>
    .wordmark { font: 132px sans-serif; fill: #FFF; }
    .tagline  { font: 46px sans-serif; fill: #FFF; }
  </style>

  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065196"/>
      <stop offset="1" stop-color="#043868"/>
    </linearGradient>

    <!-- Fades the line out at the left edge rather than letting it stop dead. -->
    <linearGradient id="edgeFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.18" stop-color="#FFF"/>
      <stop offset="1" stop-color="#FFF"/>
    </linearGradient>
    <mask id="edgeMask">
      <rect width="1024" height="500" fill="url(#edgeFade)"/>
    </mask>
  </defs>

  <rect width="1024" height="500" fill="url(#field)"/>

  <g mask="url(#edgeMask)">
    <path d="M-20,296
             C 130,296 180,272 300,272
             C 410,272 470,300 552,296
             C 596,293 606,250 668,250
             C 721,250 735,270 738,302"
          fill="none" stroke="#47AADC" stroke-width="17"
          stroke-linecap="butt" stroke-linejoin="round"/>

    <path d="M738,302
             C 739,307 739,313 739,319
             C 739,361 709,392 677,392
             C 645,392 631,378 628,361
             C 624,330 668,309 734,302
             C 774,297 822,298 872,306"
          fill="none" stroke="#148244" stroke-width="17"
          stroke-linecap="butt" stroke-linejoin="round"/>

    <circle cx="872" cy="306" r="8.5" fill="#FCD214"/>

  </g>

  <text x="56" y="252" class="wordmark">KinderDraw</text>
  <text x="60" y="392" class="tagline">Big fingers welcome.</text>
</svg>
